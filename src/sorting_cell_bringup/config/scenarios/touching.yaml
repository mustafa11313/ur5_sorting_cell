# Parts often arrive in touching pairs; the grasp planner must pick a finger
# orientation that does not collide with the neighbour.
world:
  belt_speed: 0.08
  spawn_interval: 8.0
  defect_ratio: 0.25
  touching_probability: 0.6
  scale_jitter: 0.0
  colour_jitter: 0.0
  slip_probability: 0.0
  part_types: cube cylinder hex_nut
  sun: 0.8
  lamp: 0.5
  ambient: 0.45
  sun_direction: -0.3 0.2 -1.0
  image_noise: 0.005
