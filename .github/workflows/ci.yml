name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flake8==7.1.1
      - run: flake8 src scripts

  build-and-test:
    runs-on: ubuntu-22.04
    container: osrf/ros:humble-desktop-full
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip \
            ros-humble-moveit ros-humble-pilz-industrial-motion-planner \
            ros-humble-ros2-control ros-humble-ros2-controllers ros-humble-gz-ros2-control \
            ros-humble-ur-description ros-humble-ros-gz ros-humble-py-trees ros-humble-vision-msgs
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --pytest-args -p no:cacheprovider
          colcon test-result --verbose
